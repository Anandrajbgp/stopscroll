name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger when you push a tag like v1.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64 — add it in repo Settings → Secrets"
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, re, sys
          raw = os.environ.get("KEYSTORE_BASE64", "")
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          if len(cleaned) < 100:
              print(f"KEYSTORE_BASE64 too short after cleanup ({len(cleaned)} chars)", file=sys.stderr)
              sys.exit(1)
          try:
              data = base64.b64decode(cleaned, validate=False)
          except Exception as e:
              print(f"base64 decode failed: {e}", file=sys.stderr)
              sys.exit(1)
          if len(data) < 100:
              print(f"Decoded keystore too small ({len(data)} bytes)", file=sys.stderr)
              sys.exit(1)
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "stopscroll-release.jks")
          with open(path, "wb") as f:
              f.write(data)
          print(f"Keystore decoded ({len(data)} bytes, from {len(cleaned)} base64 chars)")
          PY

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/stopscroll-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Get tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          name: Release ${{ steps.get_tag.outputs.TAG }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
